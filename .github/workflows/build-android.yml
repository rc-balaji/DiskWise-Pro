name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-android.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout full mobile source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true
      - name: Verify pinned Android build versions
        shell: bash
        run: |
          grep -Fq 'gradle-8.14-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
          grep -Fq 'version "8.11.1"' android/settings.gradle.kts
          grep -Fq 'version "2.2.20"' android/settings.gradle.kts
          flutter --version
      - name: Regenerate official Gradle wrapper files
        shell: bash
        run: |
          flutter create --platforms=android --project-name diskwise_mobile --org com.diskwise /tmp/diskwise_wrapper
          cp /tmp/diskwise_wrapper/android/gradlew android/gradlew
          cp /tmp/diskwise_wrapper/android/gradlew.bat android/gradlew.bat
          cp /tmp/diskwise_wrapper/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
          chmod +x android/gradlew
          echo "ANDROID Gradle wrapper ready; checked-in Kotlin source retained"
          grep -F 'gradle-8.14-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Dart static analysis
        run: flutter analyze --no-fatal-infos
      - name: Flutter unit tests
        run: flutter test
      - name: Build installable release APK
        run: flutter build apk --release
      - name: Native Kotlin engine unit tests
        run: cd android && ./gradlew :app:testDebugUnitTest --no-daemon
      - name: SHA256
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskWise-Mobile-v3.1-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          retention-days: 30
